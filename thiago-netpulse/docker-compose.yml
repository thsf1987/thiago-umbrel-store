version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thiago-netpulse_netpulse_1
      APP_PORT: 8080

  netpulse:
    image: ghcr.io/mrhdolek/netpulse:latest
    container_name: thiago-netpulse-server
    init: true
    environment:
      APP_ENV: prod
      APP_SECRET: "TROQUE-PELO-RESULTADO-DE-openssl-rand-hex-16"
      DATABASE_URL: sqlite:////var/www/var/netpulse.sqlite
      TZ: "America/Sao_Paulo"
    volumes:
      - netpulse_data:/var/www/var
    restart: unless-stopped

  agent:
    image: ghcr.io/mrhdolek/netpulse:latest
    depends_on:
      - netpulse
    entrypoint: ["php", "bin/console", "app:agent:run"]
    environment:
      APP_ENV: prod
      APP_SECRET: "MESMO-SECRET-DE-CIMA"
      NETPULSE_API_URL: http://netpulse:8080
      PROBE_ID: "PREENCHA-COM-O-ID-DO-PROBE"
      PROBE_TOKEN: "PREENCHA-COM-O-TOKEN-DO-PROBE"
      OOKLA_BINARY: speedtest
      AGENT_POLL_INTERVAL: 60
      TZ: "America/Sao_Paulo"
    restart: unless-stopped

volumes:
  netpulse_data:
